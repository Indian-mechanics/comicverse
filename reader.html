<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Comic Reader - ComicVerse</title>

    <link rel="stylesheet" href="Style.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">
                ComicVerse
            </div>

            <div class="nav-links">

                <a href="Index.html">Home</a>

                <a href="Comics.html">Comics</a>

            </div>

        </nav>

    </header>


    <main class="reader">

        <h1 id="comicTitle">
            Comic Reader
        </h1>


        <div class="comic-page">

            <img id="comicPage"
                 src=""
                 alt="Comic Page">

        </div>


        <div class="reader-controls">

            <button id="previous">
                ◀ Previous
            </button>

            <span id="pageNumber">
                Page 1
            </span>

            <button id="next">
                Next ▶
            </button>

        </div>

    </main>


    <script src="reader.js"></script>

</body>

</html>
